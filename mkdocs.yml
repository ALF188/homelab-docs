site_name: Homelab Docs
site_url: https://alf188.github.io/homelab-docs/
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
theme:
  name: material
  logo: images/logoShortened.svg
  favicon: images/favicon2.svg
  palette:

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - content.tooltips
    - navigation.sections
    - navigation.indexes
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
nav:
  - Home: index.md
  - Hardware: 
    - Hardware/Hardware.md
  - Networking:
    - Networking/index.md
    - Networking/Hostnames.md
    - Networking/Networks.md
    - Networking/LetsEncrypt.md
  - Services: 
    - Services/index.md
    - Services/Flame.md
    - Services/HomeAssistant.md
    - Services/JellyFB.md
    - Services/Jellyfin.md
    - Services/MeTube.md
    - Services/Nginx.md
    - Services/OMV.md
    - Services/Omnitools.md
    - Services/OpenWRT.md
    - Services/PiHole.md
    - Services/Proxmenux.md
    - Services/Proxmox.md
    - Services/RomM.md
    - Services/TailscaleVPN.md
    - Services/Vaultwarden.md
  - Changelog: Changelog/index.md